root = "."
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -buildvcs=false -o /tmp/air/atlas ."
  entrypoint = ["/tmp/air/atlas"]
  include_ext = ["go", "sql", "html", "js", "json", "yaml"]
  exclude_dir = ["bin", ".git", "monitoring", "docs/adr"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
