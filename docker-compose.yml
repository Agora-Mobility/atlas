name: atlas

x-api-env: &api-env
  APP_NAME: ${APP_NAME:-atlas}
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_OUTPUT: ${LOG_OUTPUT:-stdout}
  HTTP_PORT: 8700
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
  RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-agora.events}
  RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-5}
  RABBITMQ_RETRY_DELAY: ${RABBITMQ_RETRY_DELAY:-10s}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ISSUER: ${JWT_ISSUER:-atlas}
  CASTBRICK_API_KEY: ${CASTBRICK_API_KEY:-}
  CASTBRICK_BASE_URL: ${CASTBRICK_BASE_URL:-https://api.castbrick.co/v1}
  CASTBRICK_SENDER_ID: ${CASTBRICK_SENDER_ID:-}
  CASTBRICK_TIMEOUT: ${CASTBRICK_TIMEOUT:-10s}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_BASE_URL: ${RESEND_BASE_URL:-https://api.resend.com}
  RESEND_TIMEOUT: ${RESEND_TIMEOUT:-10s}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
  INVITATION_URL_BACKOFFICE: ${INVITATION_URL_BACKOFFICE:-http://localhost:3001/convite}
  INVITATION_URL_PARTNER_PANEL: ${INVITATION_URL_PARTNER_PANEL:-http://localhost:3002/convite}
  DISPATCH_WATCHER_INTERVAL: ${DISPATCH_WATCHER_INTERVAL:-1s}
  DISPATCH_WATCHER_BATCH: ${DISPATCH_WATCHER_BATCH:-200}
  DISPATCH_CHANNEL_TIMEOUT: ${DISPATCH_CHANNEL_TIMEOUT:-5s}
  FARE_ESTIMATE_TTL: ${FARE_ESTIMATE_TTL:-5m}
  NEARBY_MIN_CELL_COUNT: ${NEARBY_MIN_CELL_COUNT:-3}
  LOCATION_MAX_ACCURACY_M: ${LOCATION_MAX_ACCURACY_M:-100}
  LOCATION_MAX_SPEED_KMH: ${LOCATION_MAX_SPEED_KMH:-200}
  LOCATION_HISTORY_RETENTION: ${LOCATION_HISTORY_RETENTION:-720h}
  OFFER_DEEP_LINK_BASE: ${OFFER_DEEP_LINK_BASE:-agoraprovider://app}
  OPERATOR_ALERT_PHONE: ${OPERATOR_ALERT_PHONE:-}
  IDEMPOTENCY_TTL: ${IDEMPOTENCY_TTL:-24h}
  NOTIFICATION_WORKERS: ${NOTIFICATION_WORKERS:-8}
  REALTIME_PROJECTOR_WORKERS: ${REALTIME_PROJECTOR_WORKERS:-16}
  SSE_HEARTBEAT_INTERVAL: ${SSE_HEARTBEAT_INTERVAL:-15s}
  SSE_POLL_INTERVAL: ${SSE_POLL_INTERVAL:-30s}
  SSE_DEAD_AFTER: ${SSE_DEAD_AFTER:-38s}
  SSE_MAILBOX_MAX_ENTRIES: ${SSE_MAILBOX_MAX_ENTRIES:-200}
  SSE_MAILBOX_TTL: ${SSE_MAILBOX_TTL:-24h}
  SSE_RECONNECT_SPREAD: ${SSE_RECONNECT_SPREAD:-30s}
  MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
  MAPBOX_BASE_URL: ${MAPBOX_BASE_URL:-https://api.mapbox.com}
  MAPBOX_TIMEOUT: ${MAPBOX_TIMEOUT:-2s}
  MAPBOX_BREAKER_FAILURES: ${MAPBOX_BREAKER_FAILURES:-5}
  MAPBOX_BREAKER_COOLDOWN: ${MAPBOX_BREAKER_COOLDOWN:-30s}
  ROUTING_ROAD_FACTOR: ${ROUTING_ROAD_FACTOR:-1.4}
  ROUTING_FALLBACK_SPEED_KMH: ${ROUTING_FALLBACK_SPEED_KMH:-25}
  FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
  FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
  FCM_BASE_URL: ${FCM_BASE_URL:-https://fcm.googleapis.com}
  FCM_TIMEOUT: ${FCM_TIMEOUT:-5s}
  APPYPAY_CLIENT_ID: ${APPYPAY_CLIENT_ID:-}
  APPYPAY_CLIENT_SECRET: ${APPYPAY_CLIENT_SECRET:-}
  APPYPAY_BASE_URL: ${APPYPAY_BASE_URL:-}
  APPYPAY_TOKEN_URL: ${APPYPAY_TOKEN_URL:-}
  APPYPAY_RESOURCE: ${APPYPAY_RESOURCE:-}
  APPYPAY_GPO_METHOD: ${APPYPAY_GPO_METHOD:-}
  APPYPAY_REF_METHOD: ${APPYPAY_REF_METHOD:-}
  APPYPAY_TIMEOUT: ${APPYPAY_TIMEOUT:-30s}
  PAYMENT_GPO_WINDOW: ${PAYMENT_GPO_WINDOW:-5m}
  PAYMENT_REFERENCE_TTL: ${PAYMENT_REFERENCE_TTL:-72h}
  PAYMENT_RECONCILE_INTERVAL: ${PAYMENT_RECONCILE_INTERVAL:-5s}
  PAYMENT_RECONCILE_BATCH: ${PAYMENT_RECONCILE_BATCH:-50}
  PAYMENT_GPO_CHECK_INTERVAL: ${PAYMENT_GPO_CHECK_INTERVAL:-5s}
  PAYMENT_REFERENCE_CHECK_INTERVAL: ${PAYMENT_REFERENCE_CHECK_INTERVAL:-10m}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
  R2_ENDPOINT: ${R2_ENDPOINT:-}
  R2_PRESIGN_TTL: ${R2_PRESIGN_TTL:-15m}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${LOCAL_UID:-1000}
        GID: ${LOCAL_GID:-1000}
    image: atlas:dev
    environment:
      <<: *api-env
      DB_MIGRATE_ON_START: "false"
    ports:
      - "${HTTP_PORT:-8700}:8700"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/atlas/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8700/live"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks: [atlas]

  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [atlas]

  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [atlas]

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [atlas]

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [atlas]

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [atlas]

volumes:
  go-mod-cache:
  go-build-cache:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

networks:
  atlas:
    name: atlas
