info:
  contact: {}
  description: Core API of the AGORA platform.
  title: Atlas API
  version: "1.0"
paths:
  /api/v1/admin/block-reasons:
    get:
      description: Requires users:block. The active reasons an account can be blocked
        for. Send their ids in reason_ids when blocking.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.BlockReasonList'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: List block reasons
      tags:
      - Backoffice users
  /api/v1/admin/categories:
    get:
      description: Requires categories:manage. Active and inactive, in display order.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.CategoryList'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: List the service categories
      tags:
      - Backoffice catalog
    post:
      consumes:
      - application/json
      description: Requires categories:manage. The slug cannot change later. The category
        starts active but stays out of the app until it has an active service.
      parameters:
      - description: Category
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateCategoryInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.CategoryView'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: Slug already used
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Invalid fields
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Create a service category
      tags:
      - Backoffice catalog
  /api/v1/admin/categories/{id}:
    get:
      description: Requires categories:manage.
      parameters:
      - description: Category id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.CategoryView'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
