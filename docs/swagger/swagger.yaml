      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.StartedUpload'
        "409":
          description: VERIFICATION_LOCKED
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: INVALID_FILE_TYPE, FILE_TOO_LARGE, INVALID_SLOT or DOCUMENT_NOT_IN_PLAN
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Start the upload of a document file
      tags:
      - Provider verification
  /api/v1/providers/me/verification/uploads/{id}:
    get:
      description: processing, accepted or quality_failed, with each quality check
        and the reasons (TEXT_NOT_LEGIBLE, SHADOW_ON_DATA, CORNERS_NOT_VISIBLE, GLARE,
        BLURRY, TOO_DARK).
      parameters:
      - description: Upload id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.UploadView'
        "404":
          description: UPLOAD_NOT_FOUND
          schema:
