      - ClientId: []
      summary: List the roles of the organization
      tags:
      - Members
    post:
      consumes:
      - application/json
      description: Requires roles:manage. The role belongs to the organization of
        the session; it can only hold permissions of its scope that you hold yourself.
      parameters:
      - description: Role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateRoleInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.RoleView'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission or privilege escalation
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: Code already used
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Invalid fields or unknown permission
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Create a custom role
      tags:
      - Roles
  /api/v1/roles/{id}:
    delete:
      description: Requires roles:manage. Only roles no member holds.
      parameters:
      - description: Role id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission or privilege escalation
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Role not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
