    post:
      consumes:
      - application/json
      description: 'Requires Idempotency-Key, so the app can resend on a bad network
        without creating a second request. The pin is the truth; reference and address
        only help. A fare estimate serves one request: sent again while that request
        is active, the answer is 200 with it. When the estimate expired, or its request
        already ended, the answer is 409 with new quotes and no request is created.'
      parameters:
      - description: One key per tap on Request, kept for every retry of that tap
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateRequestInput'
      produces:
      - application/json
      responses:
        "200":
          description: The same key or the same fare estimate already created this
            request
          schema:
            $ref: '#/definitions/dtos.RequestView'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.RequestView'
        "409":
          description: FARE_ESTIMATE_EXPIRED or FARE_ESTIMATE_USED (both with new
            quotes), FARE_ESTIMATE_INVALID, DUPLICATE_REQUEST
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: OUTSIDE_SERVICE_AREA and others
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Create a service request
      tags:
      - Dispatch
