      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SessionOutput'
        "202":
          description: MFA step required
          schema:
            $ref: '#/definitions/dtos.MFAChallengeOutput'
        "400":
          description: Invalid request or missing client
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Invalid credentials or unknown client
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Account blocked, phone not verified or client not allowed
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - ClientId: []
      summary: Authenticate a user
      tags:
      - Auth
  /api/v1/auth/login/otp/request:
    post:
      consumes:
      - application/json
      description: Customer and provider apps only. Sends an SMS code to the account
        of the phone. Always answers 202 so the response does not reveal whether the
        phone is registered. Continue with /auth/login/otp/verify.
