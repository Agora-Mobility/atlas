  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 'Every account signs in with its phone number and password; the
        X-Client-Id header decides which accounts are accepted. Customers sign in
        through agora-customer-app and providers through agora-provider-app. Staff
        sign in through agora-backoffice (AGORA membership) or agora-partner-panel
        (partner membership). The organization is never sent: it comes from the membership
        and travels in the token. When the membership requires MFA, or the person
        has set it up, the answer is 202 with an mfa_token instead of a session: continue
        with /auth/mfa/setup and /auth/mfa/verify.'
      parameters:
      - description: Login payload
        in: body
