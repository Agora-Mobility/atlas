basePath: /
definitions:
  controllers.LiveResponse:
    properties:
      status:
        example: ok
        type: string
      version:
        example: v1.0.0
        type: string
    type: object
  controllers.ReadyResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        example: ok
        type: string
    type: object
  dtos.AcceptInput:
    properties:
      version:
        minimum: 1
        type: integer
    required:
    - version
    type: object
  dtos.AcceptInvitationInput:
    properties:
      code:
        example: "123456"
        type: string
      password:
        example: S3gredo!forte
        maxLength: 128
        type: string
      token:
        maxLength: 128
        type: string
    required:
    - code
    - password
    - token
    type: object
  dtos.AcceptResult:
    properties:
      request:
        $ref: '#/definitions/dtos.RequestView'
      route:
        $ref: '#/definitions/dtos.RouteView'
    type: object
  dtos.AccessView:
    properties:
      membership_id:
        type: string
      organization_id:
        type: string
      permissions:
        example:
        - members:read
        - members:invite
        items:
          type: string
        type: array
      scope:
        allOf:
        - $ref: '#/definitions/enums.OrganizationType'
        example: platform
    type: object
  dtos.ActiveState:
    properties:
      offers:
        items:
          $ref: '#/definitions/dtos.OfferView'
        type: array
      request:
        $ref: '#/definitions/dtos.RequestView'
    type: object
  dtos.AdjustmentView:
    properties:
      amount_cents:
        type: integer
      created_at:
        type: string
      reason:
        type: string
    type: object
  dtos.ApplicationList:
    properties:
      items:
        items:
          $ref: '#/definitions/dtos.ApplicationView'
        type: array
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  dtos.ApplicationView:
    properties:
      name:
        type: string
      phone:
        type: string
      requested_service_id:
        type: string
      requested_service_name:
        type: string
      service_id:
        type: string
      status:
        type: string
      submitted_at:
        type: string
      user_id:
        type: string
      vehicle_plate:
        type: string
    type: object
  dtos.AssignInput:
    properties:
      provider_id:
        type: string
    required:
    - provider_id
    type: object
  dtos.BlockReasonList:
    properties:
      items:
        items:
          $ref: '#/definitions/dtos.BlockReasonView'
        type: array
    type: object
  dtos.BlockReasonView:
    properties:
      code:
        example: fraud
        type: string
      id:
        type: string
      label:
        example: Fraude ou actividade suspeita
        type: string
    type: object
  dtos.BlockUserInput:
    properties:
      note:
        example: Fraude reportada pelo cliente
        maxLength: 500
        type: string
      reason_ids:
        example:
        - 0192f1d2-7c3a-7b4e-9a10-2f3c4d5e6f70
        items:
          type: string
        maxItems: 20
        minItems: 1
        type: array
    required:
    - reason_ids
    type: object
  dtos.BoostInput:
    properties:
      percent:
        enum:
        - 10
        - 20
        type: integer
    required:
    - percent
    type: object
  dtos.CadenceView:
    properties:
      accepted:
        type: integer
      distance_m:
        type: integer
      interval_s:
        type: integer
      online:
        type: boolean
      phase:
        type: string
      rejected:
        type: integer
      send_gps:
        type: boolean
    type: object
  dtos.CancelInput:
    properties:
      reason:
        maxLength: 200
        type: string
    required:
    - reason
    type: object
  dtos.Catalog:
    properties:
      categories:
        items:
          $ref: '#/definitions/dtos.CatalogCategory'
        type: array
    type: object
  dtos.CatalogCategory:
    properties:
      description:
        example: Transporte de passageiros até ao destino.
        type: string
      icon:
        example: taxi
        type: string
      id:
        type: string
      name:
        example: Táxi
        type: string
      services:
        items:
          $ref: '#/definitions/dtos.CatalogService'
        type: array
      slug:
        example: taxi
        type: string
    type: object
  dtos.CatalogService:
    properties:
      description:
        example: Viagem até ao destino indicado.
        type: string
      icon:
        example: taxi
        type: string
      id:
        type: string
      name:
        example: Táxi
        type: string
      pricing:
        $ref: '#/definitions/dtos.PricingView'
      requires_destination:
        example: true
        type: boolean
      slug:
        example: taxi
        type: string
    type: object
  dtos.CategoryList:
    properties:
      items:
        items:
          $ref: '#/definitions/dtos.CategoryView'
        type: array
    type: object
  dtos.CategoryView:
    properties:
      created_at:
        type: string
      description:
        example: Transporte de passageiros até ao destino.
        type: string
      display_order:
        example: 1
        type: integer
      icon:
        example: taxi
        type: string
      id:
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Táxi
        type: string
      slug:
        example: taxi
        type: string
      updated_at:
        type: string
    type: object
  dtos.ChangePasswordInput:
    properties:
      current_password:
        maxLength: 128
        type: string
      new_password:
        type: string
    required:
    - current_password
    - new_password
    type: object
  dtos.ChangeRouteInput:
    properties:
      destination:
        $ref: '#/definitions/dtos.PlaceInput'
      stops:
        items:
          $ref: '#/definitions/dtos.PlaceInput'
        maxItems: 3
        type: array
    required:
    - destination
    type: object
  dtos.CoverageInput:
    properties:
      lat:
        type: number
      lng:
        type: number
      radius_km:
        maximum: 300
        minimum: 0
        type: number
    required:
    - lat
    - lng
    type: object
  dtos.CoverageView:
    properties:
      categories:
        type: integer
      cells:
        type: integer
      lat:
        type: number
      lng:
        type: number
      radius_km:
        type: number
    type: object
  dtos.CreateCategoryInput:
    properties:
      description:
        example: Limpeza de casas e escritórios.
        maxLength: 500
        type: string
      display_order:
        example: 5
        maximum: 9999
        minimum: 0
        type: integer
      icon:
        example: cleaning
        maxLength: 255
        type: string
      name:
        example: Limpeza
        maxLength: 80
        type: string
      slug:
        example: cleaning
        maxLength: 40
        type: string
    required:
    - name
    - slug
    type: object
  dtos.CreatePartnerInput:
    properties:
      name:
        example: Transportes Kianda
        maxLength: 120
        type: string
      nif:
        example: "5417123456"
        maxLength: 20
        type: string
    required:
    - name
    type: object
  dtos.CreateRequestInput:
    properties:
      contact_phone:
        maxLength: 20
        type: string
      destination:
        $ref: '#/definitions/dtos.PlaceInput'
      details:
        type: object
      fare_estimate_id:
        type: string
      passenger:
        $ref: '#/definitions/dtos.PassengerInput'
      pickup:
        $ref: '#/definitions/dtos.PlaceInput'
      scheduled_for:
        type: string
      service_id:
        type: string
      stops:
        items:
          $ref: '#/definitions/dtos.PlaceInput'
        maxItems: 3
        type: array
    required:
    - pickup
    - service_id
    type: object
  dtos.CreateRoleInput:
    properties:
      code:
        example: field_support
        maxLength: 40
        type: string
      name:
        example: Suporte de campo
        maxLength: 80
        type: string
      permissions:
        example:
        - members:read
        - providers:read
        items:
          type: string
        maxItems: 60
        minItems: 1
        type: array
      requires_mfa:
        type: boolean
    required:
    - code
    - name
    - permissions
    type: object
  dtos.CreateServiceInput:
    properties:
      category_id:
        type: string
      description:
        example: Viatura de gama alta.
        maxLength: 500
        type: string
      display_order:
        example: 2
        maximum: 9999
        minimum: 0
        type: integer
      icon:
        example: taxi-executive
        maxLength: 255
        type: string
      is_active:
        description: IsActive defaults to true.
        example: true
        type: boolean
      name:
        example: Táxi Executivo
        maxLength: 80
        type: string
      pricing:
        $ref: '#/definitions/dtos.PricingInput'
      requires_destination:
        example: true
        type: boolean
      slug:
        example: taxi-executive
        maxLength: 40
        type: string
    required:
    - category_id
    - name
    - requires_destination
    - slug
    type: object
  dtos.DeleteAccountInput:
    properties:
      code:
        example: "123456"
        type: string
      password:
        maxLength: 128
        type: string
    type: object
  dtos.DeliveredInput:
    properties:
      channel:
        enum:
        - sse
        - fcm
        - sms
        type: string
    required:
    - channel
    type: object
  dtos.DeviceInput:
    properties:
      platform:
        enum:
        - android
        - ios
        type: string
      token:
        maxLength: 4096
        type: string
    required:
    - platform
    - token
    type: object
  dtos.DocumentURLOutput:
    properties:
      expires_at:
        type: string
      url:
        type: string
    type: object
  dtos.DocumentView:
    properties:
      content_type:
        type: string
      name:
        type: string
      rejection_reason:
        type: string
      reviewed_at:
        type: string
      size_bytes:
        type: integer
      status:
        type: string
      type:
        type: string
      updated_at:
        type: string
      url:
        type: string
      url_expires_at:
        type: string
    type: object
  dtos.FareEstimateInput:
    properties:
      category:
        example: taxi
        type: string
      destination:
        $ref: '#/definitions/dtos.PlaceInput'
      pickup:
        $ref: '#/definitions/dtos.PlaceInput'
      stops:
        items:
          $ref: '#/definitions/dtos.PlaceInput'
        maxItems: 3
        type: array
    required:
    - category
    - pickup
    type: object
  dtos.FareEstimateList:
    properties:
      items:
        items:
          $ref: '#/definitions/dtos.FareEstimateView'
        type: array
    type: object
  dtos.FareEstimateView:
    properties:
      currency:
        type: string
      distance_m:
        type: integer
      duration_s:
        type: integer
      expires_in_s:
        type: integer
      fare_estimate_id:
