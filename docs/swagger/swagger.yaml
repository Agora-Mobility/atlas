basePath: /
definitions:
  controllers.LiveResponse:
    properties:
      status:
        example: ok
        type: string
      version:
        example: v1.0.0
        type: string
    type: object
  controllers.ReadyResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        example: ok
        type: string
    type: object
info:
  contact: {}
  description: Core API of the AGORA platform.
  title: Atlas API
  version: "1.0"
paths:
  /live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.LiveResponse'
      summary: Liveness probe
      tags:
      - health
  /ready:
    get:
      description: Checks PostgreSQL, Redis and RabbitMQ.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/controllers.ReadyResponse'
      summary: Readiness probe
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: '"Bearer <token>"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
