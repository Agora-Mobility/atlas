    - token
    type: object
  dtos.InviteMemberInput:
    properties:
      email:
        example: operador@agora.ao
        maxLength: 254
        type: string
      name:
        example: Operador AGORA
        maxLength: 120
        type: string
      phone:
        example: "+244923000010"
        maxLength: 32
        type: string
      role_ids:
        items:
          type: string
        maxItems: 20
        minItems: 1
        type: array
    required:
    - email
    - name
    - phone
    - role_ids
    type: object
  dtos.LocationsInput:
    properties:
      battery_low:
        type: boolean
      network_weak:
        type: boolean
      positions:
        items:
          $ref: '#/definitions/dtos.PositionInput'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - positions
    type: object
  dtos.LoginInput:
    properties:
      identifier:
        example: "+244923000000"
        maxLength: 254
        type: string
      organization_id:
        type: string
