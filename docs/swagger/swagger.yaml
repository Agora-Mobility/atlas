info:
  contact: {}
  description: Core API of the AGORA platform.
  title: Atlas API
  version: "1.0"
paths:
  /api/v1/admin/block-reasons:
    get:
      description: Requires users:block. The active reasons an account can be blocked
        for. Send their ids in reason_ids when blocking.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.BlockReasonList'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: List block reasons
      tags:
      - Backoffice users
  /api/v1/admin/cancellation-rules:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.CancellationRuleList'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Cancellation rules of every service
      tags:
      - Backoffice
  /api/v1/admin/cancellation-rules/{serviceId}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Service id
        in: path
        name: serviceId
        required: true
        type: string
      - description: Rule
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CancellationRuleInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.CancellationRuleView'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Set the cancellation rule of a service
      tags:
      - Backoffice
  /api/v1/admin/catalog/{kind}:
    get:
      description: kind is one of compliment, tip_preset, quick_reply, towing_vehicle,
        towing_incident, removal_item, removal_vehicle, removal_extra, removal_window,
        removal_property, help_topic or workshop_category.
      parameters:
      - description: Catalog
        in: path
        name: kind
        required: true
        type: string
      - description: Category slug
        in: query
        name: category
        type: string
      - description: Only the removal items of this removal_property code; an item
          without properties fits every type
        in: query
        name: property
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.CatalogItemList'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: List a catalog of the backoffice
      tags:
      - Backoffice
    post:
      consumes:
      - application/json
      description: Prices are integer cents. attrs holds the numbers of each kind,
        such as included_km on towing_vehicle, and they are validated. A removal_item
        may list in attrs.properties the removal_property codes it belongs to, such
        as ["home", "office"]; without the list it fits every type.
      parameters:
      - description: Catalog
        in: path
        name: kind
        required: true
        type: string
      - description: Item
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CatalogItemInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.CatalogItemView'
        "409":
          description: The code exists
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Add an item to a catalog
      tags:
      - Backoffice
  /api/v1/admin/catalog/{kind}/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Catalog
        in: path
        name: kind
        required: true
        type: string
      - description: Item id
        in: path
        name: id
        required: true
        type: string
      - description: Item
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CatalogItemInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.CatalogItemView'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Change an item of a catalog
      tags:
      - Backoffice
  /api/v1/admin/categories:
    get:
      description: Requires categories:manage. Active and inactive, in display order.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.CategoryList'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: List the service categories
      tags:
      - Backoffice catalog
    post:
      consumes:
      - application/json
      description: Requires categories:manage. The slug cannot change later. The category
        starts active but stays out of the app until it has an active service.
      parameters:
      - description: Category
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateCategoryInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.CategoryView'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: Slug already used
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Invalid fields
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Create a service category
      tags:
      - Backoffice catalog
  /api/v1/admin/categories/{id}:
    get:
      description: Requires categories:manage.
      parameters:
      - description: Category id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.CategoryView'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Get a service category
      tags:
      - Backoffice catalog
    patch:
      consumes:
      - application/json
      description: Requires categories:manage. Only the fields sent change. Setting
        is_active to false hides the category and all its services from the app; categories
        are never deleted.
      parameters:
      - description: Category id
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateCategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.CategoryView'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Invalid fields
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Change a service category
      tags:
      - Backoffice catalog
  /api/v1/admin/demand-pricing:
    get:
      description: 'The price rises in an area of the zone when more customers wait
        than providers are free, by tiers of the ratio (customers + 1) / (free providers
        + 1), up to the cap. Each customer counts once, whether they quoted, requested
        or both. Ratios and factors are basis points: 10000 is 1.0.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.DemandPricingList'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: List the demand pricing of each zone and category
      tags:
      - Backoffice dispatch
    put:
      consumes:
      - application/json
      description: A tier applies when the smoothed ratio is above above_ratio_bps.
        Mode off stops measuring and brings every price of the zone back to normal
        at once; observe measures and records the factor that would apply, without
        changing prices, to calibrate the tiers; on charges it. Estimates already
        given keep their price.
      parameters:
      - description: Demand pricing
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.DemandPricingInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.DemandPricingView'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Set the demand tiers, cap and switch of a zone and category
      tags:
      - Backoffice dispatch
  /api/v1/admin/demand-pricing/areas:
    get:
      description: Areas of the zone where demand is above normal now, with the smoothed
        ratio and the factor quotes use. Areas not listed price at 1.0.
      parameters:
      - description: Zone
        in: query
        name: zone_id
        required: true
        type: string
      - description: Category slug
        in: query
        name: category
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.DemandAreaList'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Current demand factor by area
      tags:
      - Backoffice dispatch
  /api/v1/admin/demand-pricing/history:
    get:
      description: One row per area and minute while demand was above normal. Defaults
        to the last 24 hours.
      parameters:
      - description: Zone
        in: query
        name: zone_id
        required: true
        type: string
      - description: Category slug
        in: query
        name: category
        required: true
        type: string
      - description: From, YYYY-MM-DD or RFC 3339
        in: query
        name: from
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.DemandHistory'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Demand factor history
      tags:
      - Backoffice dispatch
  /api/v1/admin/dispatch-policies:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.PolicyList'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: List the dispatch policies
      tags:
      - Backoffice dispatch
    post:
      consumes:
      - application/json
      description: The resolution and radii are refused when they would need too many
        H3 cells per search.
      parameters:
      - description: Policy
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.PolicyInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.PolicyView'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
