  /events:
    get:
      description: Server-Sent Events of the signed-in customer or provider. Send
        Last-Event-ID to replay what was missed. Offers carry expires_in_s, relative
        to the moment of delivery. When the cursor is older than the mailbox a resync
        event asks the app to reload through GET /api/v1/requests/active.
      parameters:
      - description: Id of the last event received
        in: header
        name: Last-Event-ID
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Event stream
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Only app accounts have a stream
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
