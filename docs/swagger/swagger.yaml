          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Delete a custom role
      tags:
      - Roles
    get:
      description: Requires roles:read. A role of another organization answers 404.
      parameters:
      - description: Role id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.RoleView'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Role not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Get a role
      tags:
      - Roles
    patch:
      consumes:
      - application/json
      description: Requires roles:manage. New permissions apply to every member with
        the role on their next request.
      parameters:
      - description: Role id
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateRoleInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.RoleView'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Missing permission or privilege escalation
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Role not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: System role
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Invalid fields or unknown permission
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Change a custom role
      tags:
      - Roles
  /api/v1/users/me:
    delete:
      consumes:
      - application/json
      description: Customers and providers only. Confirm with password or, without
        a password, with a code from /users/me/verification-code. Ends every session
        at once; the phone and e-mail can be registered again.
      parameters:
      - description: Password or code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.DeleteAccountInput'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Staff accounts cannot be deleted here
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: Account has no password
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Missing confirmation, wrong password or code
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Delete the account of the authenticated user
      tags:
      - Users
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.UserView'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Token bound to another client
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Get the authenticated user
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Changes only the fields sent. Changing or removing the e-mail requires
        current_password or a code from /users/me/verification-code. The phone number
        changes through /users/me/phone.
      parameters:
      - description: Profile fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateProfileInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.UserView'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Token bound to another client
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Invalid fields, missing confirmation, wrong password or code
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Update the profile of the authenticated user
      tags:
      - Users
  /api/v1/users/me/mfa/recovery-codes:
    post:
      consumes:
      - application/json
      description: Confirm with a code of the authenticator app. The previous recovery
        codes stop working.
      parameters:
      - description: Authenticator code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.MFACodeInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.RecoveryCodesOutput'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: MFA not set up
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Wrong code
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Generate new MFA recovery codes
      tags:
      - Auth
  /api/v1/users/me/permissions:
    get:
      description: 'For the UI only: every endpoint checks its own permission.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.MyAccessView'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Not a staff session
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Effective permissions of the signed-in member
      tags:
      - Members
  /api/v1/users/me/phone:
    put:
      consumes:
      - application/json
      parameters:
      - description: New phone and code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.PhoneChangeConfirmInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.UserView'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: Phone already registered
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Invalid, expired or exhausted code
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Confirm the new phone number with the code
      tags:
      - Users
  /api/v1/users/me/phone/verification-code:
    post:
      consumes:
      - application/json
      description: Sends an SMS code to the new number. Only the signed-in user who
        asked for it can use the code.
      parameters:
      - description: New phone
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.PhoneChangeRequestInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/dtos.MessageOutput'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: Phone already registered
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Invalid phone or same as the current one
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "429":
          description: Code sent recently or too many requests
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "503":
          description: SMS unavailable
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Send a code to a new phone number
      tags:
      - Users
  /api/v1/users/me/verification-code:
    post:
      description: The code confirms an e-mail change or the account deletion when
        the user has no password. Customers and providers only.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/dtos.MessageOutput'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Staff accounts confirm with the password
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "429":
          description: Code sent recently or too many requests
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "503":
          description: SMS unavailable
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Send a confirmation code to the account phone
      tags:
      - Users
  /api/v1/users/password:
    post:
      consumes:
      - application/json
      description: Accounts created by phone have no password and sign in with an
        SMS code. This sets the first password and keeps the current sessions. Use
        PUT /users/password to change an existing one.
      parameters:
      - description: Set password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.SetPasswordInput'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Token bound to another client
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: Account already has a password
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Invalid password
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Set a password on an account that has none
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Ends every session of the user. Accounts without a password get
        409 PASSWORD_NOT_SET and use POST /users/password instead.
      parameters:
      - description: Change password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.ChangePasswordInput'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Unauthorized or session ended
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Token bound to another client
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: Account has no password
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Wrong current password or invalid new password
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Change the password of the authenticated user
      tags:
      - Users
  /live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.LiveResponse'
      summary: Liveness probe
      tags:
      - health
  /ready:
    get:
      description: Checks PostgreSQL, Redis and RabbitMQ.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/controllers.ReadyResponse'
      summary: Readiness probe
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Access token (Bearer) returned by /api/v1/auth/login.
    in: header
    name: Authorization
    type: apiKey
  ClientId:
    description: 'Client application: agora-customer-app, agora-provider-app, agora-partner-panel
      or agora-backoffice. Required on every /api/v1 endpoint.'
    in: header
    name: X-Client-Id
    type: apiKey
swagger: "2.0"
