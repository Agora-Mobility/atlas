  /api/v1/admin/dispatch/flows:
    get:
      description: Requests with a destination created in the period, grouped by pickup
        and destination resolution 8 cells and sorted by volume. Pairs below min_requests
        (default 3) and pairs beyond limit (default 500) are left out and counted
        in hidden, so a single trip is not shown. The period defaults to the last
        24 hours and spans at most 31 days.
      parameters:
      - description: Zone id
        in: query
        name: zone_id
        type: string
      - description: Category slug
        in: query
        name: category
        type: string
      - description: Start of the period (RFC 3339)
        in: query
        name: from
        type: string
      - description: End of the period (RFC 3339), default now
        in: query
        name: to
        type: string
      - description: Smallest pair shown, 1 to 1000
        in: query
        name: min_requests
        type: integer
      - description: Most pairs returned, 1 to 2000
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.FlowMap'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Origin to destination flows by H3 cell
      tags:
      - Backoffice dispatch
  /api/v1/admin/dispatch/heatmap:
    get:
      description: Resolution 8 hexagons for the Google Maps map of the backoffice.
        Demand counts the requests created in the period, by pickup cell; the period
        defaults to the last 24 hours and spans at most 31 days. Supply is always
        the providers online right now, whatever the period.
      parameters:
      - description: Zone id
        in: query
        name: zone_id
        type: string
      - description: Category slug
        in: query
        name: category
        type: string
      - description: Start of the period (RFC 3339)
        in: query
        name: from
        type: string
      - description: End of the period (RFC 3339), default now
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.HeatMap'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Supply and demand by H3 cell
      tags:
      - Backoffice dispatch
  /api/v1/admin/dispatch/heatmap/cells:
    get:
      description: Requests per H3 cell for a hexagon layer such as deck.gl H3HexagonLayer,
        read from the cells the heatmap job aggregates every few minutes in 15 minute
        windows. The zoom picks the resolution (by default up to 10 is 6, 11 and 12
        are 7, 13 and 14 are 8, from 15 is 9). When the view holds more than 20000
        cells the next coarser resolution is used, and resolution tells which one
        answered; only when even resolution 6 does not fit the answer is 400 AREA_TOO_LARGE.
        value is the smoothed heat (0.6 of the cell plus 0.4 of the mean of its six
        neighbors); count is the raw number of requests. Windows of the period are
        summed. The period defaults to the last complete window and spans at most
        7 days. h3 is always the hexadecimal index, since 64 bit integers lose precision
        in JavaScript.
      parameters:
      - description: minLng,minLat,maxLng,maxLat
        example: 13.15,-8.95,13.35,-8.75
        in: query
        name: bbox
        required: true
        type: string
      - description: Map zoom, 0 to 24
        in: query
        name: zoom
        required: true
        type: integer
      - description: Start of the period (RFC 3339)
        in: query
        name: from
        type: string
      - description: End of the period (RFC 3339)
        in: query
        name: to
        type: string
      - description: count or value, default value
        enum:
        - count
        - value
        in: query
        name: metric
        type: string
      - description: Category slug, default all
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.HeatCellsView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Heat of the H3 cells inside the map view
      tags:
      - Backoffice dispatch
