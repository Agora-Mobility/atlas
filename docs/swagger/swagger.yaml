      otpauth_uri:
        example: otpauth://totp/AGORA:ana@agora.ao?secret=JBSWY3DPEHPK3PXP&issuer=AGORA
        type: string
      secret:
        example: JBSWY3DPEHPK3PXP
        type: string
    type: object
  dtos.MFATokenInput:
    properties:
      mfa_token:
        maxLength: 128
        type: string
    required:
    - mfa_token
    type: object
  dtos.MFAVerifyInput:
    properties:
      code:
