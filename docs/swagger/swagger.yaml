      - ClientId: []
      summary: State of an uploaded file
      tags:
      - Provider verification
  /api/v1/providers/me/verification/uploads/{id}/confirm:
    post:
      description: 'Checks with HeadObject that the file exists and fits the size,
        and checks the magic bytes. The file then goes to processing: EXIF and GPS
        are removed and the quality is checked in the queue. Poll GET /uploads/{id}
        for accepted or quality_failed with the reasons (BI-E4). Confirming twice
        answers the same file.'
      parameters:
      - description: Upload id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.UploadView'
        "404":
          description: UPLOAD_NOT_FOUND
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "422":
          description: FILE_NOT_UPLOADED, FILE_TOO_LARGE or INVALID_FILE_TYPE
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Confirm an uploaded file
      tags:
      - Provider verification
