          description: Only app accounts have a stream
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      - ClientId: []
      summary: Real-time events
      tags:
      - Real time
  /live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.LiveResponse'
      summary: Liveness probe
      tags:
      - health
  /ready:
    get:
      description: Checks PostgreSQL, Redis and RabbitMQ.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/controllers.ReadyResponse'
      summary: Readiness probe
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Access token (Bearer) returned by /api/v1/auth/login.
    in: header
    name: Authorization
    type: apiKey
  ClientId:
    description: 'Client application: agora-customer-app, agora-provider-app, agora-partner-panel
      or agora-backoffice. Required on every /api/v1 endpoint.'
    in: header
    name: X-Client-Id
    type: apiKey
