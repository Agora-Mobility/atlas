  /api/v1/providers/me/verification/uploads:
    post:
      consumes:
      - application/json
      description: Checks the document type, slot, subject, content type and size,
        and returns a pre-signed PUT to R2 with the headers to send. Then PUT the
        file and call the confirm endpoint. A new file for the same slot replaces
        the old one once it is accepted; the old one is kept as superseded. The identity
        card sides are slots front and back of id_card; the SIAC renewal receipt is
        the renewal_receipt slot.
      parameters:
      - description: Repeat safely
        in: header
        name: Idempotency-Key
