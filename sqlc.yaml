version: "2"
sql:
  - engine: postgresql
    # sqlc reads golang-migrate files and ignores *.down.sql.
    schema: migrations
    queries: infra/database/sqlc/queries
    gen:
      go:
        package: gen
        out: infra/database/sqlc/gen
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        json_tags_case_style: snake
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: user_role
            go_type: github.com/Agora-Mobility/atlas/shared/enums.Role
          - db_type: user_role
            nullable: true
            go_type:
              import: github.com/Agora-Mobility/atlas/shared/enums
              type: Role
              pointer: true
          - db_type: user_status
            go_type: github.com/Agora-Mobility/atlas/shared/enums.UserStatus
          - db_type: user_status
            nullable: true
            go_type:
              import: github.com/Agora-Mobility/atlas/shared/enums
              type: UserStatus
              pointer: true
          - db_type: organization_type
            go_type: github.com/Agora-Mobility/atlas/shared/enums.OrganizationType
          - db_type: membership_status
            go_type: github.com/Agora-Mobility/atlas/shared/enums.MembershipStatus
          - db_type: membership_status
            nullable: true
            go_type:
              import: github.com/Agora-Mobility/atlas/shared/enums
              type: MembershipStatus
              pointer: true
          - db_type: client_type
            go_type: github.com/Agora-Mobility/atlas/shared/enums.ClientType
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
          # PostGIS columns are read through ST_X/ST_Y or ST_AsText in queries;
          # when selected raw they arrive as hex-encoded EWKB text.
          - db_type: geometry
            go_type: string
          - db_type: geography
            go_type: string
