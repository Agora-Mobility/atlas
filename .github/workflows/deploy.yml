name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image:
        type: string
        required: true
      digest:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      TARGET: ${{ inputs.environment }}
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ inputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Point the environment tag at this image
        run: |
          tags=(--tag "$IMAGE:$TARGET")
          if [[ "$TARGET" == "production" ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"

      - name: Deploy to server
        if: inputs.environment == 'production'
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_REF: ${{ inputs.image }}@${{ inputs.digest }}
          ENV_FILE_BASE64: ${{ secrets.ENV_PRODUCTION_BASE64 }}
          FCM_CREDENTIALS_BASE64: ${{ secrets.FCM_CREDENTIALS_BASE64 }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_SSH_PORT || '22' }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          command_timeout: 15m
          envs: IMAGE_REF,ENV_FILE_BASE64,FCM_CREDENTIALS_BASE64,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -eu
            CONTAINER=atlas-api
            PREVIOUS=atlas-api-previous

            mkdir -p "$HOME/atlas"
            cd "$HOME/atlas"
            trap 'rm -f .env; docker logout docker.io >/dev/null 2>&1 || true' EXIT

            echo "📄 Criando .env"
            if [ -z "$ENV_FILE_BASE64" ]; then
              echo "❌ secret ENV_PRODUCTION_BASE64 is empty"
              exit 1
            fi
            (umask 077 && printf '%s' "$ENV_FILE_BASE64" | base64 --decode > .env)

            echo "🔑 Credencial do Firebase"
            mkdir -p secrets && chmod 700 secrets
            if [ -n "${FCM_CREDENTIALS_BASE64:-}" ]; then
              printf '%s' "$FCM_CREDENTIALS_BASE64" | base64 --decode > secrets/firebase.json.new
              chmod 444 secrets/firebase.json.new
              mv secrets/firebase.json.new secrets/firebase.json
            fi
            FCM_ARGS=""
            if [ -s secrets/firebase.json ]; then
              FCM_ARGS="-v $HOME/atlas/secrets/firebase.json:/run/secrets/firebase.json:ro -e FCM_CREDENTIALS_FILE=/run/secrets/firebase.json"
            else
              echo "⚠️ secrets/firebase.json não existe: o push fica desligado se FCM_CREDENTIALS_JSON também estiver vazio"
            fi

            echo "🌐 Garantindo redes docker"
            if ! docker network inspect atlas >/dev/null 2>&1; then
              echo "❌ docker network 'atlas' not found: start infra-prod/applications first"
              exit 1
            fi
            docker network inspect atlas-api >/dev/null 2>&1 ||
              docker network create --subnet 172.30.3.0/24 --gateway 172.30.3.1 atlas-api

            echo "📥 Pull da imagem $IMAGE_REF"
            printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$IMAGE_REF"

            start_container() {
              docker run -d \
                --name "$CONTAINER" \
                --restart unless-stopped \
                --env-file .env \
                $FCM_ARGS \
                -e HTTP_PORT=8700 \
                -e LOG_OUTPUT=stdout \
                -e TRUSTED_PROXIES=172.30.3.1 \
                --network atlas-api \
                --read-only \
                --cap-drop ALL \
                --security-opt no-new-privileges \
                --health-interval 5s \
                --health-timeout 3s \
                --health-start-period 30s \
                --health-retries 3 \
                --stop-timeout 30 \
                "$1"
              docker network connect atlas "$CONTAINER"
            }

            wait_healthy() {
              for _ in $(seq 1 60); do
                status=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null) || status=missing
                [ "$status" = healthy ] && return 0
                [ "$status" = unhealthy ] && return 1
                sleep 3
              done
              return 1
            }

            echo "🛑 Parando container antigo"
            docker rm -f "$PREVIOUS" >/dev/null 2>&1 || true
            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              docker stop "$CONTAINER" >/dev/null
              docker rename "$CONTAINER" "$PREVIOUS"
            fi

            echo "🐳 Subindo container"
            if start_container "$IMAGE_REF" && wait_healthy; then
              docker rm -f "$PREVIOUS" >/dev/null 2>&1 || true
              echo "🧹 Limpando imagens antigas"
              docker image prune -af >/dev/null
              docker ps --filter "name=^${CONTAINER}$"
              echo "✅ Deploy realizado com sucesso!"
              exit 0
            fi

            echo "❌ A nova versão não ficou saudável, últimos logs:"
            docker logs --tail 100 "$CONTAINER" || true
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            if docker container inspect "$PREVIOUS" >/dev/null 2>&1; then
              echo "↩️ Voltando à versão anterior"
              docker rename "$PREVIOUS" "$CONTAINER"
              docker start "$CONTAINER" >/dev/null
            fi
            exit 1

      - name: Summary
        if: success()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$TARGET" == "production" ]]; then
            echo "Deployed \`$IMAGE@$DIGEST\` ($VERSION) to the production server" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tagged \`$IMAGE@$DIGEST\` ($VERSION) as $TARGET, no server for this environment" >> "$GITHUB_STEP_SUMMARY"
          fi
