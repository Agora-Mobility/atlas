name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [staging, production]
        required: true
      version:
        description: "Image tag to restore: a release (1.4.2) or a build (sha-1a2b3c4)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.environment }} to ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      TARGET: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+|sha-[0-9a-f]{7,40})$ ]]; then
            echo "::error::version must look like 1.4.2 or sha-1a2b3c4, got '$VERSION'"
            exit 1
          fi
          if [[ "$TARGET" == "production" && "$VERSION" == sha-* ]]; then
            echo "::error::production only runs released versions (1.4.2), not builds"
            exit 1
          fi

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Resolve digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Restoring $IMAGE:$VERSION ($digest)"

      - name: Verify the image was signed by the CD pipeline
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cd.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Point the environment tag at the restored image
        run: |
          tags=(--tag "$IMAGE:$TARGET")
          if [[ "$TARGET" == "production" ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"

      - name: Deploy
        run: echo "Deploy $IMAGE:$VERSION ($DIGEST) to $TARGET (not configured yet)"
