name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to restore, such as 1.4.2"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be a release such as 1.4.2, got '$VERSION'"
            exit 1
          fi

      - name: Image name
        id: image
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
        run: echo "name=docker.io/$NAMESPACE/atlas" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Resolve digest
        id: digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Restoring $IMAGE:$VERSION ($digest)"

      - name: Verify the image was signed by the CD pipeline
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.digest.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cd.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

  deploy:
    name: Roll back production to ${{ inputs.version }}
    needs: resolve
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.resolve.outputs.image }}
      digest: ${{ needs.resolve.outputs.digest }}
      version: ${{ inputs.version }}
    secrets: inherit
