name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Build, sign and push image
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Image name
        id: image
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
        run: echo "name=docker.io/$NAMESPACE/atlas" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.release-please.outputs.version }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Sign image
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json

  release-assets:
    name: Attach image to GitHub release
    needs: [release-please, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sbom

      - name: Upload SBOM and image reference
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          gh release upload "$TAG" sbom.spdx.json --clobber
          gh release view "$TAG" --json body --jq .body > notes.md
          cat >> notes.md <<EOF

          ### Image

          \`$IMAGE:$VERSION\`

          \`$IMAGE@$DIGEST\`

          \`\`\`
          cosign verify $IMAGE@$DIGEST \\
            --certificate-identity https://github.com/$GH_REPO/.github/workflows/cd.yml@refs/heads/main \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          gh release edit "$TAG" --notes-file notes.md

  deploy-production:
    name: Deploy to production
    needs: [release-please, image]
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
