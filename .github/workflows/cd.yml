name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, sign and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (OIDC)
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sbom
      - uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: sbom.spdx.json
          body: |
            Image: `${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}`

            Verify the signature:
            ```
            cosign verify ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }} \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

  # Deploy placeholders: no infrastructure yet. Configure required reviewers
  # on the "staging" and "production" environments in the repository settings
  # to get manual approval before these jobs run.
  deploy-staging:
    name: Deploy to staging
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Placeholder
        run: echo "Deploy ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }} to staging (not configured yet)"

  deploy-production:
    name: Deploy to production
    if: github.ref_type == 'tag'
    needs: [image, release]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Placeholder
        run: echo "Deploy ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }} to production (not configured yet)"
