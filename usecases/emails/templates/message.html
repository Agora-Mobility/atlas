<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;">
<tr><td style="padding:24px 32px;border-bottom:1px solid #e4e7eb;font-size:20px;font-weight:bold;">AGORA</td></tr>
<tr><td style="padding:32px;font-size:15px;line-height:1.6;">
<p style="margin:0 0 16px;">{{.Greeting}}</p>
{{range .Lines}}<p style="margin:0 0 16px;">{{.}}</p>
{{end}}{{if .ActionURL}}<p style="margin:24px 0;"><a href="{{.ActionURL}}" style="display:inline-block;background:#1f6feb;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-weight:bold;">{{.ActionLabel}}</a></p>
<p style="margin:0 0 16px;font-size:13px;color:#52606d;">Se o botão não funcionar, copie este endereço para o navegador:<br><span style="word-break:break-all;">{{.ActionURL}}</span></p>
{{end}}{{range .Notes}}<p style="margin:0 0 12px;font-size:13px;color:#52606d;">{{.}}</p>
{{end}}</td></tr>
<tr><td style="padding:16px 32px;border-top:1px solid #e4e7eb;font-size:12px;color:#7b8794;">Equipa AGORA. Esta mensagem foi enviada automaticamente, não responda.</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
